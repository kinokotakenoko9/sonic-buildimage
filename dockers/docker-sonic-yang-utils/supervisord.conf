[supervisord]
logfile_maxbytes=1MB
logfile_backups=2
nodaemon=true

; [eventlistener:dependent-startup]
; command=python3 -m supervisord_dependent_startup
; autostart=true
; autorestart=unexpected
; startretries=0
; exitcodes=0,3
; events=PROCESS_STATE
; buffer_size=1024

[program:start]
command=/usr/bin/start.sh
priority=2
autostart=true
autorestart=false
startsecs=0
dependent_startup=true

[program:yang-utils]
command=/usr/bin/yang-utils.sh
priority=3
autostart=true
autorestart=true
dependent_startup=true
dependent_startup_wait_for=start:exited
